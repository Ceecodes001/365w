<!doctype html>
<html lang="en">
<head>

  <style>
    body {
      margin: 0;

      margin: 0 0 12px;
      font-size: 28px;
    }
    p {
      margin: 0 0 24px;
      line-height: 1.6;
      color: #454545;
    }
    a {
      display: inline-block;
      text-decoration: none;
      background: #1769aa;
      color: #fff;
      padding: 12px 20px;
      border-radius: 4px;
      font-weight: 600;

      background: #0f548c;

  <div class="card">
